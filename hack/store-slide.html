<!doctype html>
<html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #111a27 0%, #172131 45%, #1e2a3b 100%);
    color: #fff; position: relative;
  }
  .copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 390px; }
  h1 { margin: 0 0 22px; font-size: 44px; line-height: 1.16; letter-spacing: -0.02em; font-weight: 800; word-break: keep-all; }
  h1 em { font-style: normal; color: #f9a01b; }
  p { margin: 0; font-size: 19px; line-height: 1.62; color: #b6c1ce; word-break: keep-all; }
  .shot { position: absolute; top: 50%; transform: translateY(-50%); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); border-radius: 10px; overflow: hidden; }
  .shot img { display: block; width: 100%; }

  /* A stand-in console page; the real one cannot be shown without signing in. */
  .browser { width: 700px; background: #fff; }
  .tabs { height: 38px; background: #dee1e6; display: flex; align-items: flex-end; padding-left: 10px; }
  .tab { height: 32px; background: #fff; border-radius: 8px 8px 0 0; padding: 0 16px 0 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #202124; }
  .tab i { width: 12px; height: 12px; border-radius: 3px; background: #3c4553; display: inline-block; }
  .bar { height: 44px; background: #fff; display: flex; align-items: center; padding: 0 12px; }
  .url { flex: 1; height: 28px; border-radius: 14px; background: #f1f3f4; display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: #3c4043; }
  .console { position: relative; height: 435px; background: #f2f3f3; overflow: hidden; }
  .stripe { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #1d8102; z-index: 3; }
  .frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 3px #d13212; z-index: 3; pointer-events: none; }
  .nav { height: 40px; background: #161d26; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: #d5dbdb; font-size: 12px; }
  .logo { width: 30px; height: 18px; border-radius: 3px; background: #414d5c; }
  .search { width: 350px; height: 24px; border-radius: 4px; background: #2a3341; display: flex; align-items: center; padding: 0 10px; color: #8d99a8; }
  .who { margin-left: auto; }
  .home { padding: 26px 30px; }
  .home h2 { margin: 0 0 18px; font-size: 22px; color: #16191f; font-weight: 700; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px 18px; height: 168px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
  .card b { display: block; font-size: 14.5px; color: #16191f; margin-bottom: 14px; }
  .line { height: 8px; border-radius: 4px; background: #e3e6ea; margin-bottom: 12px; }
  .pill { position: absolute; left: 12px; bottom: 44px; z-index: 4; display: flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px;
    background: #1d8102; color: #fff; font: 600 12px/1.4 system-ui, -apple-system, sans-serif; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
  .pill span:last-child { font-weight: 400; opacity: 0.85; }
</style>
<body>
<div class="copy"><h1 id="title"></h1><p id="body"></p></div>
<div id="shot" class="shot"></div>
<script>
// One template for every language; the captures (popup.png, accounts.png, cli.png) sit next to this file.
const COPY = {
  en: {
    slides: [
      { title: 'Every AWS<br>account, <em>one click</em><br>away', body: 'Type to filter, press Enter to open. IAM users, Switch Role, IAM Identity Center and any sign-in URL, grouped by project.' },
      { title: 'Always know<br><em>which account</em> you<br>are in', body: 'A label on every console tab. Protected accounts get a red frame and their name in the tab title.' },
      { title: 'Your accounts,<br><em>your labels</em>', body: 'Free-form tags, a color per project and a protected flag for the accounts where a mistake is costly.' },
      { title: 'Import from<br><em>~/.aws/config</em>', body: "One entry per account, however many profiles point at it. A ready-to-copy command for macOS, Windows and Linux looks up every profile's account ID." },
    ],
    console: { title: 'Console Home', search: 'Search', cards: ['Recently visited', 'Welcome', 'Cost and usage', 'Health', 'Applications', 'Build a solution'] },
  },
  ko: {
    slides: [
      { title: '모든 AWS 계정을<br><em>클릭 한 번</em>에', body: '입력해서 거르고 Enter로 엽니다. IAM 사용자, Switch Role, IAM Identity Center와 모든 로그인 URL을 프로젝트별로 묶어 보여 줍니다.' },
      { title: '지금 <em>어느 계정</em>인지<br>항상 보이게', body: '콘솔 탭마다 계정 라벨을 띄웁니다. 보호 계정은 빨간 테두리를 두르고 탭 제목 앞에 이름을 붙입니다.' },
      { title: '내 계정,<br><em>내 라벨</em>', body: '자유로운 태그와 프로젝트별 색을 달고, 실수하면 곤란한 계정은 보호 계정으로 지정합니다.' },
      { title: '<em>~/.aws/config</em>에서<br>가져오기', body: '프로필이 여러 개여도 계정당 하나로 가져옵니다. macOS, Windows, Linux용 명령을 복사해 실행하면 모든 프로필의 계정 ID를 찾아 줍니다.' },
    ],
    console: { title: '콘솔 홈', search: '검색', cards: ['최근에 방문한 서비스', 'AWS 시작', '비용 및 사용량', 'AWS Health', '애플리케이션', '솔루션 구축'] },
  },
};
const LAYOUT = [{ img: 'popup.png', left: 658, width: 400 }, { left: 508, width: 700 }, { img: 'accounts.png', left: 508, width: 700 }, { img: 'cli.png', left: 508, width: 700 }];

const params = new URLSearchParams(location.search);
const lang = params.get('lang') ?? 'en';
const n = Number(params.get('n') ?? 0);
const { slides, console: mock } = COPY[lang];
document.documentElement.lang = lang;
document.getElementById('title').innerHTML = slides[n].title;
document.getElementById('body').textContent = slides[n].body;
const shot = document.getElementById('shot');
shot.style.left = LAYOUT[n].left + 'px';
shot.style.width = LAYOUT[n].width + 'px';
if (LAYOUT[n].img) shot.innerHTML = `<img src="${LAYOUT[n].img}">`;
else {
  const lines = (count) => Array.from({ length: count }, (_, i) => `<div class="line" style="width:${i % 2 ? 70 : 100}%"></div>`).join('');
  const cards = mock.cards.map((title, i) => `<div class="card"><b>${title}</b>${lines([4, 3, 4, 2, 4, 3][i])}</div>`).join('');
  shot.innerHTML = `<div class="browser">
    <div class="tabs"><div class="tab"><i></i>[shop-prod] ${mock.title}</div></div>
    <div class="bar"><div class="url">us-east-1.console.aws.amazon.com/console/home</div></div>
    <div class="console"><div class="stripe"></div><div class="frame"></div>
      <div class="nav"><div class="logo"></div><div class="search">${mock.search}</div><div class="who">us-east-1 · Admin/jane</div></div>
      <div class="home"><h2>${mock.title}</h2><div class="cards">${cards}</div></div>
      <div class="pill"><span>prod · shop-prod</span><span>1111-2222-3333</span></div>
    </div></div>`;
}
</script>
</body>
</html>
